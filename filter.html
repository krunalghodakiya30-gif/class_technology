<html>
     <head>
	      <title> CSS Filter Example </title>
		  <style>
		  img{
		      width:300px;
			  filter: grayscale(100%);
			  transition: 0.5s;
			 }
			 
			 img:hover {
			      filter:grayscale(0%) brightness(120%);
				}  
         </style>
</head>	
<body>
     <h2>CSS Filter property</h2>
     <img src="img1.jpg">	 
</body>		
</html>
